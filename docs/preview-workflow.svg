    <text x="292" y="222" text-anchor="middle" fill="#8ea8cf" font-family="'Segoe UI', sans-serif" font-size="11.5">Interval acak anti-kaku</text>

    <!-- Arrow 2 -->
    <text x="394" y="142" text-anchor="middle" fill="#ff2e7e" font-family="Consolas, monospace" font-size="20" font-weight="700">⚡</text>

