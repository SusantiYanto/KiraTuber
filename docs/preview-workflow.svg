    <rect x="0" y="38" width="176" height="196" rx="12" fill="#111a2e" stroke="#2c4475" stroke-width="2"/>
    <rect x="14" y="52" width="66" height="22" rx="5" fill="#1c2c4c"/>
    <text x="47" y="67" text-anchor="middle" fill="#93add4" font-family="Consolas, monospace" font-size="11" font-weight="700">01 DIAM</text>
