    <g transform="translate(55, 28) scale(0.52)">
      <path d="M84 196 C74 275 95 344 132 362 L268 362 C305 344 326 275 316 196 C312 118 265 82 200 82 C135 82 88 118 84 196 Z" fill="#d84b78" stroke="#182232" stroke-width="8" stroke-linejoin="round"/>
      <path d="M104 128 L124 62 L168 106 Z" fill="#ffffff" stroke="#182232" stroke-width="7" stroke-linejoin="round"/>
      <path d="M118 116 L130 78 L156 104 Z" fill="#38bdf8"/>
      <path d="M296 128 L276 62 L232 106 Z" fill="#ffffff" stroke="#182232" stroke-width="7" stroke-linejoin="round"/>
      <path d="M282 116 L270 78 L244 104 Z" fill="#38bdf8"/>
      <path d="M84 204 C84 114 134 78 200 78 C266 78 316 114 316 204" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
