<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="KiraTuber — Anime PNGTuber Studio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="55%" stop-color="#0d162c"/>
      <stop offset="100%" stop-color="#141029"/>
    </linearGradient>
    <linearGradient id="cyanPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2e7e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2f6ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="vuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2e7e"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00e5ff" fill-opacity="0.14"/>
    </pattern>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="14" height="28" fill="#00e5ff"/>
      <rect x="14" width="14" height="28" fill="#ff2e7e"/>
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="18" fill="url(#dots)"/>
  <circle cx="980" cy="70" r="220" fill="#00e5ff" fill-opacity="0.08"/>
  <circle cx="220" cy="340" r="200" fill="#ff2e7e" fill-opacity="0.09"/>

  <!-- Top Broadcast Hazard Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#stripes)"/>
  <rect x="2" y="2" width="1196" height="376" rx="17" fill="none" stroke="#243a66" stroke-width="2"/>

  <!-- Left HUD Corner Brackets -->
  <path d="M26 52 L26 28 L52 28" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 328 L26 352 L52 352" fill="none" stroke="#ff2e7e" stroke-width="3" stroke-linecap="round"/>
  <path d="M1174 52 L1174 28 L1148 28" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M1174 328 L1174 352 L1148 352" fill="none" stroke="#ff2e7e" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Content Column -->
  <g transform="translate(64, 58)">
    <!-- Brand Mark + ON AIR Pill -->
    <g transform="skewX(-10)">
      <rect x="0" y="0" width="44" height="44" rx="9" fill="url(#cyanPink)" stroke="#ffffff" stroke-width="2"/>
      <text x="22" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">✦</text>

      <rect x="58" y="7" width="106" height="30" rx="6" fill="#ff2e7e" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="75" cy="22" r="4.5" fill="#ffffff"/>
      <text x="118" y="27" text-anchor="middle" fill="#ffffff" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">ON AIR</text>

      <rect x="174" y="7" width="196" height="30" rx="6" fill="#13203b" stroke="#00e5ff" stroke-width="1.5"/>
      <text x="272" y="27" text-anchor="middle" fill="#00e5ff" font-family="Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="0.8">TAURI V2 · RUST ENGINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="116" fill="url(#titleGrad)" font-family="Bahnschrift, 'Chakra Petch', 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="2.5">KIRATUBER</text>
    <text x="2" y="152" fill="#a8c2e8" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600">Anime PNGTuber Broadcast Studio — Ringan, Responsif, &amp; Siap OBS</text>

    <!-- Live VU Meter Mock -->
    <rect x="0" y="176" width="540" height="22" rx="6" fill="#060a13" stroke="#293e6a" stroke-width="2"/>
    <rect x="3" y="179" width="405" height="16" rx="4" fill="url(#vuGrad)"/>
    <g fill="#0c1426">
      <rect x="48" y="178" width="4" height="18"/><rect x="96" y="178" width="4" height="18"/>
      <rect x="144" y="178" width="4" height="18"/><rect x="192" y="178" width="4" height="18"/>
      <rect x="240" y="178" width="4" height="18"/><rect x="288" y="178" width="4" height="18"/>
      <rect x="336" y="178" width="4" height="18"/><rect x="384" y="178" width="4" height="18"/>
      <rect x="432" y="178" width="4" height="18"/><rect x="480" y="178" width="4" height="18"/>
    </g>
    <rect x="164" y="174" width="4" height="26" rx="2" fill="#ffffff"/>

    <!-- Feature Chips -->
    <g transform="translate(0, 222)" font-family="Consolas, 'Segoe UI', monospace" font-size="13" font-weight="700">
      <rect x="0" y="0" width="154" height="36" rx="8" fill="#111c33" stroke="#00f5a0" stroke-width="1.8"/>
      <text x="77" y="23" text-anchor="middle" fill="#00f5a0">⚡ 1.1 MB SETUP</text>

      <rect x="166" y="0" width="194" height="36" rx="8" fill="#111c33" stroke="#00e5ff" stroke-width="1.8"/>
      <text x="263" y="23" text-anchor="middle" fill="#00e5ff">👁️ 3-POSE AUTO BLINK</text>

      <rect x="372" y="0" width="184" height="36" rx="8" fill="#111c33" stroke="#ff2e7e" stroke-width="1.8"/>
      <text x="464" y="23" text-anchor="middle" fill="#ff7aa8">🎮 OBS ANTI-FREEZE</text>

      <rect x="568" y="0" width="168" height="36" rx="8" fill="#111c33" stroke="#ffe600" stroke-width="1.8"/>
      <text x="652" y="23" text-anchor="middle" fill="#ffe600">🪟 WIN &amp; LINUX</text>
    </g>
