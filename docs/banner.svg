    <rect x="14" y="14" width="282" height="236" rx="12" fill="#00b140" fill-opacity="0.18" stroke="#00f5a0" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="28" y="36" fill="#00f5a0" font-family="Consolas, monospace" font-size="11.5" font-weight="700">CHROMA STAGE · 60 FPS</text>

