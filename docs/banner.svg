      <path d="M116 384 C122 326 154 304 200 304 C246 304 278 326 284 384 Z" fill="#24344d" stroke="#182232" stroke-width="8" stroke-linejoin="round"/>
      <path d="M168 312 L200 344 L232 312" fill="#ffffff" stroke="#182232" stroke-width="6" stroke-linejoin="round"/>
      <polygon points="200,336 178,324 182,350" fill="#38bdf8" stroke="#182232" stroke-width="4"/>
      <polygon points="200,336 222,324 218,350" fill="#38bdf8" stroke="#182232" stroke-width="4"/>
      <circle cx="200" cy="337" r="7" fill="#ffffff" stroke="#182232" stroke-width="4"/>
      <path d="M108 196 C108 134 146 108 200 108 C254 108 292 134 292 196 C292 266 254 312 200 312 C146 312 108 266 108 196 Z" fill="#fff2ea" stroke="#182232" stroke-width="8"/>
      <ellipse cx="132" cy="252" rx="18" ry="9" fill="#ff8fab" opacity="0.65"/>
      <ellipse cx="268" cy="252" rx="18" ry="9" fill="#ff8fab" opacity="0.65"/>
      <path d="M130 186 Q152 176 172 185" fill="none" stroke="#182232" stroke-width="5" stroke-linecap="round"/>
      <path d="M228 185 Q248 176 270 186" fill="none" stroke="#182232" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="152" cy="218" rx="21" ry="25" fill="#182232"/>
      <ellipse cx="152" cy="222" rx="16" ry="19" fill="#0ea5e9"/>
      <circle cx="145" cy="210" r="7" fill="#ffffff"/><circle cx="160" cy="229" r="3.5" fill="#ffffff"/>
      <ellipse cx="248" cy="218" rx="21" ry="25" fill="#182232"/>
      <ellipse cx="248" cy="222" rx="16" ry="19" fill="#0ea5e9"/>
      <circle cx="241" cy="210" r="7" fill="#ffffff"/><circle cx="256" cy="229" r="3.5" fill="#ffffff"/>
      <path d="M174 266 Q200 258 226 266 Q230 302 200 305 Q170 302 174 266 Z" fill="#6b1d3a" stroke="#182232" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="200" cy="291" rx="18" ry="10" fill="#ff7aa2"/>
      <path d="M98 206 C96 132 140 90 200 90 C260 90 304 132 302 206 C288 164 268 144 250 182 C236 146 218 138 202 184 C186 142 166 142 150 182 C134 146 114 164 98 206 Z" fill="#ff85a9" stroke="#182232" stroke-width="7.5" stroke-linejoin="round"/>
      <rect x="74" y="190" width="30" height="58" rx="14" fill="#ffffff" stroke="#182232" stroke-width="7"/>
      <rect x="82" y="203" width="10" height="32" rx="5" fill="#38bdf8"/>
      <rect x="296" y="190" width="30" height="58" rx="14" fill="#ffffff" stroke="#182232" stroke-width="7"/>
      <rect x="308" y="203" width="10" height="32" rx="5" fill="#38bdf8"/>
      <path d="M92 242 Q108 286 154 286" fill="none" stroke="#182232" stroke-width="6" stroke-linecap="round"/>
      <circle cx="157" cy="286" r="8" fill="#ff5688" stroke="#182232" stroke-width="5"/>
    </g>

    <!-- Bottom Keycap Bar inside Card -->
    <g transform="translate(14, 262)" font-family="Consolas, monospace" font-size="12" font-weight="700">
      <rect x="0" y="0" width="64" height="32" rx="7" fill="#182440" stroke="#00e5ff" stroke-width="1.8"/>
      <text x="32" y="20" text-anchor="middle" fill="#00e5ff">[Z] 😮</text>

      <rect x="73" y="0" width="64" height="32" rx="7" fill="#182440" stroke="#ff2e7e" stroke-width="1.8"/>
      <text x="105" y="20" text-anchor="middle" fill="#ff7aa8">[X] ✨</text>

      <rect x="146" y="0" width="64" height="32" rx="7" fill="#182440" stroke="#00f5a0" stroke-width="1.8"/>
      <text x="178" y="20" text-anchor="middle" fill="#00f5a0">[1] ⤴</text>

      <rect x="219" y="0" width="63" height="32" rx="7" fill="#182440" stroke="#ffe600" stroke-width="1.8"/>
      <text x="250" y="20" text-anchor="middle" fill="#ffe600">[H] HUD</text>
